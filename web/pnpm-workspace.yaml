packages:
  - apps/*
  - packages/*

# pnpm catalogs：单一版本源，供各包用 `catalog:` 引用（对应 Rust workspace
# 的 [workspace.dependencies]）。改版本只需改这里，全仓同步。
catalog:
  "@base-ui/react": ^1.7.0
  # 运行时
  react: ^19.0.0
  react-dom: ^19.0.0
  radix-ui: ^1.6.7
  tw-animate-css: ^1.4.0
  shadcn: ^4.19.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.34.0
  tailwind-merge: ^3.6.0
  # 开发/构建
  typescript: ^5.6.0
  vite: ^8.2.2
  "@vitejs/plugin-react": ^6.1.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@types/node": ^22.0.0

allowBuilds:
  esbuild: set this to true or false
minimumReleaseAgeExclude:
  - lucide-react@1.34.0
