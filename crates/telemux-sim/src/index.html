<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Telemux-Sim — CDU 仿真器</title>
<style>
  body { font-family: Consolas, "Microsoft YaHei", monospace; margin: 16px; background: #f5f6fa; overflow-x: hidden; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 20px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  .status { font-size: 12px; color: #888; margin-bottom: 10px; }
  .panel { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .ctrl-row label { width: 130px; font-size: 12px; }
  .ctrl-row input[type=number] { width: 80px; padding: 3px 6px; font-size: 13px; }
  .ctrl-row .val { font-size: 13px; color: #0a7; }
  button { padding: 4px 14px; cursor: pointer; }
  /* Canvas 系统图：aspect-ratio 保持 1040:640 比例，宽度自适应不溢出 */
  #sys { background: #fbfcfe; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  #sys canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 1040 / 640;
    display: block;
    max-width: 100%;
  }
  table { border-collapse: collapse; background: #fff; margin-top: 6px; width: 100%; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; font-size: 12px; }
  th { background: #2f3b52; color: #fff; }
  tr:nth-child(even) { background: #f9f9f9; }
  .addr { color: #888; font-size: 11px; }
  .mono { font-family: Consolas, monospace; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Telemux-Sim · CDU 仿真器</h1>
<div class="status" id="status">连接中…</div>

<!-- ===== 温度设定与控制变量 ===== -->
<div class="panel">
  <div class="card">
    <h3>温度设定（立即生效）</h3>
    <div class="ctrl-row"><label>一次侧冷水 T1 (°C)</label>
      <input type="number" id="in_cold" step="0.5" value="12">
      <button onclick="setControl('primary_cold_temp', 'in_cold')">应用</button>
      <span class="val" id="v_cold"></span></div>
    <div class="ctrl-row"><label>二次侧热水 T5 (°C)</label>
      <input type="number" id="in_hot" step="0.5" value="45">
      <button onclick="setControl('secondary_hot_temp', 'in_hot')">应用</button>
      <span class="val" id="v_hot"></span></div>
  </div>
  <div class="card">
    <h3>运行控制</h3>
    <div class="ctrl-row"><label>Pump1 duty (%)</label>
      <input type="number" id="in_p1" step="1" value="50">
      <button onclick="setControl('pump1_duty', 'in_p1')">应用</button>
      <span class="val" id="v_p1"></span></div>
    <div class="ctrl-row"><label>Pump2 duty (%)</label>
      <input type="number" id="in_p2" step="1" value="40">
      <button onclick="setControl('pump2_duty', 'in_p2')">应用</button>
      <span class="val" id="v_p2"></span></div>
    <div class="ctrl-row"><label>Valve1 duty (%)</label>
      <input type="number" id="in_v1" step="1" value="30">
      <button onclick="setControl('valve1_duty', 'in_v1')">应用</button>
      <span class="val" id="v_v1"></span></div>
    <div class="ctrl-row"><label>Fan duty (%)</label>
      <input type="number" id="in_fan" step="1" value="60">
      <button onclick="setControl('fan_duty', 'in_fan')">应用</button>
      <span class="val" id="v_fan"></span></div>
  </div>
</div>

<!-- ===== 二维系统图（Canvas） ===== -->
<h2>CDU 系统图（实时）</h2>
<div id="sys"><canvas id="cv" width="1040" height="640"></canvas></div>

<!-- ===== 寄存器表 ===== -->
<h2>寄存器地图原始值</h2>
<div class="table-wrap">
<table id="raw">
  <thead><tr><th>区域</th><th>地址</th><th>槽位</th><th>原始值</th><th>解码</th></tr></thead>
  <tbody></tbody>
</table>
</div>

<script>
// ===== Canvas 常量 =====
const CV_W = 1040, CV_H = 640;
const COL = {
  bg: '#fbfcfe', pipe_cold: '#5c9be6', pipe_hot: '#e07878', pipe: '#94a3b8',
  temperature: '#e0850f', pressure: '#3377cc', flow: '#2f9e44', level: '#7048e8',
  ph: '#c2255c', leak: '#e03131', humidity: '#1098ad',
};

// 传感器在系统图上的坐标（x, y）+ 标签 + 所属回路
const SENSOR_POS = {
  // 一次侧（冷水，左侧）
  "cdu.pri.p1":   {x: 110, y: 90,  label: "P1"},
  "cdu.pri.t1":   {x: 195, y: 90,  label: "T1"},
  "cdu.pri.p2":   {x: 110, y: 135, label: "P2"},
  "cdu.pri.t2":   {x: 195, y: 135, label: "T2"},
  "cdu.pri.f1":   {x: 280, y: 112, label: "F1"},
  "cdu.pri.l1":   {x: 60,  y: 250, label: "L1"},
  "cdu.pri.t3":   {x: 195, y: 460, label: "T3"},
  "cdu.pri.p3":   {x: 110, y: 460, label: "P3"},
  "cdu.pri.t4":   {x: 195, y: 505, label: "T4"},
  "cdu.pri.p4":   {x: 110, y: 505, label: "P4"},
  // 二次侧（热水，右侧）
  "cdu.sec.f2":   {x: 660, y: 112, label: "F2"},
  "cdu.sec.t5":   {x: 745, y: 90,  label: "T5"},
  "cdu.sec.p5":   {x: 830, y: 90,  label: "P5"},
  "cdu.sec.t6":   {x: 745, y: 135, label: "T6"},
  "cdu.sec.p6":   {x: 830, y: 135, label: "P6"},
  "cdu.sec.t7":   {x: 745, y: 460, label: "T7"},
  "cdu.sec.p7":   {x: 830, y: 460, label: "P7"},
  "cdu.sec.t8":   {x: 745, y: 505, label: "T8"},
  "cdu.sec.p8":   {x: 830, y: 505, label: "P8"},
  // 泵（二次侧，PHEX 出口→服务器 之间）；泵1 中心 x=545，泵2 中心 x=625
  "cdu.pump1.in_p":  {x: 490, y: 300, label: "泵1进"},
  "cdu.pump1.out_p": {x: 490, y: 375, label: "泵1出"},
  "cdu.pump2.in_p":  {x: 570, y: 300, label: "泵2进"},
  "cdu.pump2.out_p": {x: 570, y: 375, label: "泵2出"},
  // 补水/回水管路（原膨胀槽区，不画槽体）
  "cdu.tank.p9":     {x: 585, y: 50,  label: "P9"},
  "cdu.tank.p10":    {x: 665, y: 50,  label: "P10"},
  "cdu.tank.level":  {x: 625, y: 90,  label: "LL1"},
  "cdu.tank.ph":     {x: 625, y: 130, label: "PH1"},
  // 环境 / 泄漏（右下）
  "cdu.env.temp":    {x: 890, y: 560, label: "环境 T"},
  "cdu.env.rh":      {x: 890, y: 595, label: "环境 RH"},
  "cdu.leak":        {x: 890, y: 610, label: "LEAK"},
};

const KIND_COLOR = COL; // 复用配色

let current = null; // 最近一次状态

// ===== Canvas 绘制 =====
function draw(ctx) {
  ctx.clearRect(0, 0, CV_W, CV_H);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, CV_W, CV_H);

  // ---- 管路（先画，传感器覆盖其上）----
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // 一次侧（冷水回路）：入口上 → PHEX 左上；PHEX 左下 → 回水
  ctx.strokeStyle = COL.pipe_cold;
  ctx.beginPath();
  ctx.moveTo(40, 112); ctx.lineTo(330, 112);   // 冷水进管
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(330, 390); ctx.lineTo(40, 390);   // 一次侧回水管
  ctx.stroke();
  // 一次侧 L1 支路
  ctx.strokeStyle = COL.pipe;
  ctx.beginPath();
  ctx.moveTo(90, 112); ctx.lineTo(90, 250); ctx.lineTo(70, 250);
  ctx.stroke();

  // 二次侧（热水回路）：服务器回水（上）→ PHEX 右上；PHEX 右下 → 泵 → 服务器供水（下）
  ctx.strokeStyle = COL.pipe_hot;
  ctx.beginPath();
  ctx.moveTo(1000, 112); ctx.lineTo(710, 112);  // 服务器回水管（热）
  ctx.stroke();
  ctx.strokeStyle = COL.pipe_cold;
  ctx.beginPath();
  ctx.moveTo(710, 390); ctx.lineTo(1000, 390);  // 服务器供水管（冷）
  ctx.stroke();
  // 泵连接：PHEX 出口(650,390) → 右侧竖管 → 泵入口汇管(y=292) → 泵出口汇管(y=383) → 服务器供水管
  const P1X = 545, P2X = 625, P_TOP = 300, P_BOT = 375;
  ctx.strokeStyle = COL.pipe;
  ctx.lineWidth = 3;
  // PHEX 右下 → 泵右侧竖管(680) → 泵入口汇管
  ctx.beginPath();
  ctx.moveTo(650, 390); ctx.lineTo(680, 390); ctx.lineTo(680, 292);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(680, 292); ctx.lineTo(P1X, 292);
  ctx.stroke();
  // 泵入口短竖管（汇管 → 泵顶）
  ctx.beginPath();
  ctx.moveTo(P1X, 292); ctx.lineTo(P1X, P_TOP);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(P2X, 292); ctx.lineTo(P2X, P_TOP);
  ctx.stroke();
  // 泵出口短竖管（泵底 → 出口汇管 y=383）
  ctx.beginPath();
  ctx.moveTo(P1X, P_BOT); ctx.lineTo(P1X, 383);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(P2X, P_BOT); ctx.lineTo(P2X, 383);
  ctx.stroke();
  // 出口汇管 → 服务器供水管
  ctx.beginPath();
  ctx.moveTo(P1X, 383); ctx.lineTo(P2X, 383); ctx.lineTo(710, 390);
  ctx.stroke();
  // 补水/回水支路（原膨胀槽）
  ctx.strokeStyle = COL.pipe;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(625, 112); ctx.lineTo(625, 140);   // 补水口连到回水管
  ctx.stroke();

  // ---- PHEX 板换（居中）----
  ctx.fillStyle = '#dff0d8';
  ctx.strokeStyle = '#5b8c5a';
  ctx.lineWidth = 2;
  roundRect(ctx, 340, 90, 130, 310, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5b8c5a';
  ctx.font = 'bold 14px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PHEX', 405, 240);
  ctx.font = '10px Consolas, monospace';
  ctx.fillText('板式换热器', 405, 256);

  // ---- 泵（PHEX 右下 → 服务器之间）----
  drawPump(ctx, 545, 300, '泵1');
  drawPump(ctx, 625, 300, '泵2');

  // ---- 服务器（右侧竖管）----
  ctx.fillStyle = '#eee';
  ctx.strokeStyle = '#999';
  roundRect(ctx, 1000, 60, 26, 360, 4);
  ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.translate(1013, 240);
  ctx.rotate(Math.PI / 2);
  ctx.fillStyle = '#666';
  ctx.font = '10px Consolas, monospace';
  ctx.fillText('SERVER', 0, 0);
  ctx.restore();

  // ---- 一次侧 H1 比例阀 ----
  ctx.fillStyle = '#f59f00';
  ctx.beginPath();
  ctx.moveTo(318, 104); ctx.lineTo(336, 112); ctx.lineTo(318, 120); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e8590c';
  ctx.font = '10px Consolas, monospace';
  ctx.fillText('H1', 340, 120);

  // ---- 传感器标点 ----
  const values = new Map(current.sensors.map(s => [s.sensor_id, s]));
  ctx.textAlign = 'left';
  for (const [id, pos] of Object.entries(SENSOR_POS)) {
    const sv = values.get(id);
    const kind = sv ? sv.kind : 'other';
    const color = KIND_COLOR[kind] || '#888';
    const val = sv && sv.value !== null ? Number(sv.value).toFixed(1) : '—';
    const unit = sv && sv.unit ? sv.unit : '';
    // 圆点
    ctx.fillStyle = color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 7, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // 标签 + 值
    ctx.fillStyle = '#555';
    ctx.font = '11px Consolas, monospace';
    ctx.fillText(pos.label, pos.x + 11, pos.y - 8);
    ctx.fillStyle = color;
    ctx.font = 'bold 12px Consolas, monospace';
    ctx.fillText(val + ' ' + unit, pos.x + 11, pos.y + 8);
  }

  // 回路标注
  ctx.fillStyle = '#777';
  ctx.font = '12px Consolas, monospace';
  ctx.fillText('一次侧（冷水回路）', 40, 30);
  ctx.fillText('二次侧（热水回路）', 700, 30);
  // 流向箭头（示意）
  drawArrow(ctx, 300, 112, 330, 112, COL.pipe_cold);
  drawArrow(ctx, 330, 390, 300, 390, COL.pipe_hot);
  drawArrow(ctx, 710, 112, 740, 112, COL.pipe_hot);
  drawArrow(ctx, 740, 390, 710, 390, COL.pipe_cold);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPump(ctx, x, y, label) {
  // 泵体：中心 (x, y+37)，尺寸 70x75；进出口由外部汇管连接（泵顶 y、泵底 y+75）
  ctx.fillStyle = '#e7f5ff';
  ctx.strokeStyle = '#4dabf7';
  ctx.lineWidth = 2;
  roundRect(ctx, x - 35, y, 70, 75, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4dabf7';
  ctx.font = 'bold 12px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y + 40);
  ctx.textAlign = 'left';
}

function drawArrow(ctx, x1, y1, x2, y2, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.stroke();
  // 箭头头部
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 8 * Math.cos(ang - 0.4), y2 - 8 * Math.sin(ang - 0.4));
  ctx.lineTo(x2 - 8 * Math.cos(ang + 0.4), y2 - 8 * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// ===== 控制变量设置 =====
async function setControl(name, inputId) {
  const input = document.getElementById(inputId);
  const value = parseFloat(input.value);
  if (isNaN(value)) return;
  try {
    const res = await fetch('/api/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, value }),
    });
    const j = await res.json();
    if (!j.ok) alert(`设置失败: ${j.error}`);
  } catch (e) { alert(`请求失败: ${e}`); }
}

// ===== 渲染 =====
function render(data) {
  current = data;

  // Canvas 系统图
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  draw(ctx);

  // 控制变量输入框回显
  const c = {};
  for (const x of data.controls) c[x.name] = x;
  const setField = (name, inputId, valId, unit) => {
    if (c[name]) {
      document.getElementById(inputId).value = c[name].value;
      document.getElementById(valId).textContent = c[name].value + ' ' + unit;
    }
  };
  setField('primary_cold_temp', 'in_cold', 'v_cold', '°C');
  setField('secondary_hot_temp', 'in_hot', 'v_hot', '°C');
  setField('pump1_duty', 'in_p1', 'v_p1', '%');
  setField('pump2_duty', 'in_p2', 'v_p2', '%');
  setField('valve1_duty', 'in_v1', 'v_v1', '%');
  setField('fan_duty', 'in_fan', 'v_fan', '%');

  // 寄存器原始值表
  const rtbody = document.querySelector('#raw tbody');
  const rows = [];
  for (const h of data.holding) {
    rows.push(`<tr><td>保持</td><td class="addr">0x${h.addr.toString(16).padStart(4,'0')}</td>` +
      `<td>${h.slot ? h.slot.control : '空'}</td><td class="mono">${h.raw}</td>` +
      `<td>${h.slot ? (h.slot.writable ? '可写 u16' : '只读 u16') : '—'}</td></tr>`);
  }
  for (const inp of data.inputs) {
    rows.push(`<tr><td>输入</td><td class="addr">0x${inp.addr.toString(16).padStart(4,'0')}</td>` +
      `<td>${inp.sensor ?? '空'}</td>` +
      `<td class="mono">${inp.raw_hi} ${inp.raw_lo}</td>` +
      `<td class="mono">${Number(inp.value_f32).toFixed(3)}</td></tr>`);
  }
  rtbody.innerHTML = rows.join('');

  document.getElementById('status').textContent =
    `已更新 ${new Date().toLocaleTimeString()} · WebSocket 推送 · ${data.controls.length} 控制变量 · ${data.sensors.length} 传感器`;
}

// ===== WebSocket 接收（主通道）=====
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(`${proto}${location.host}/api/ws`);
  ws.onmessage = (ev) => {
    try { render(JSON.parse(ev.data)); } catch (e) { console.warn('bad ws payload', e); }
  };
  ws.onclose = () => {
    document.getElementById('status').textContent = 'WebSocket 断开，重连中…';
    setTimeout(connectWs, 1500); // 自动重连
  };
  ws.onerror = () => ws.close();
}

// 首次：HTTP 拉一次（立即显示），随后走 WebSocket
fetch('/api/state').then(r => r.json()).then(render).catch(() => {});
connectWs();
</script>
</body>
</html>
