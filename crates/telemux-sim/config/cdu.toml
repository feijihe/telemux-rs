# Telmux-Sim CDU 仿真配置
#
# 独立模拟器：无硬件，用稳态代数模型模拟一台液冷 CDU 的全部传感器。
# 作为 Modbus-TCP 从站暴露寄存器地址（保持区=控制变量，输入区=传感器），
# 供 Telemux 网关以 transport="tcp" 读取与控制（与真实 CDU 完全同构）。
#
# 用法：
#   cargo run -p telemux-sim -- --config config/cdu.toml \
#       --modbus-port 1502 --web-port 8082
# 网页 UI：http://127.0.0.1:8082  （观察所有寄存器地址/类型/原始值）
#
[sim]

# ---- 控制变量（可写，驱动仿真；协议层 PATCH/Modbus 写入即改变 duty）----
[[sim.controls]]
name = "pump1_duty"          # 二次侧泵 1 占空比 %
initial = 50
unit = "%"
writable = true

[[sim.controls]]
name = "pump2_duty"          # 二次侧泵 2 占空比 %
initial = 40
unit = "%"
writable = true

[[sim.controls]]
name = "valve1_duty"         # 一次侧 H1 比例阀开度 %
initial = 30
unit = "%"
writable = true

[[sim.controls]]
name = "fan_duty"            # 服务器散热风扇占空比 %
initial = 60
unit = "%"
writable = true

# ---- 一次侧（冷水回路）物理传感器 ----
[[sim.sensors]]
sensor_id = "cdu.pri.p1"
name = "Primary Inlet P1"
kind = "pressure"
unit = "kPa"
formula = "300 + valve1_duty * 1.2"          # 阀开度越大，一次侧进口压力越高

[[sim.sensors]]
sensor_id = "cdu.pri.p2"
name = "Primary Inlet P2"
kind = "pressure"
unit = "kPa"
formula = "p1 - 8"                            # P2 在阀后，压损 8 kPa
[sim.sensors.inputs]
p1 = "cdu.pri.p1"

[[sim.sensors]]
sensor_id = "cdu.pri.t1"
name = "Primary Inlet T1 (cold)"
kind = "temperature"
unit = "°C"
formula = "12 + 0.5 * sin(t)"                # 冷水供水 ~12°C，缓慢波动

[[sim.sensors]]
sensor_id = "cdu.pri.t2"
name = "Primary Inlet T2"
kind = "temperature"
unit = "°C"
formula = "t1 + 0.3"                          # 略高于进口
[sim.sensors.inputs]
t1 = "cdu.pri.t1"

[[sim.sensors]]
sensor_id = "cdu.pri.f1"
name = "Primary Flow F1"
kind = "flow"
unit = "L/min"
formula = "8 + valve1_duty * 0.9"            # 比例阀开度↑ → 一次侧流量↑

[[sim.sensors]]
sensor_id = "cdu.pri.p3"
name = "Primary Outlet P3"
kind = "pressure"
unit = "kPa"
formula = "p2 - f1 * 0.05"                   # 板换一次侧压损随流量
[sim.sensors.inputs]
p2 = "cdu.pri.p2"
f1 = "cdu.pri.f1"

[[sim.sensors]]
sensor_id = "cdu.pri.p4"
name = "Primary Outlet P4"
kind = "pressure"
unit = "kPa"
formula = "p3 - 4"
[sim.sensors.inputs]
p3 = "cdu.pri.p3"

[[sim.sensors]]
sensor_id = "cdu.pri.t3"
name = "Primary Outlet T3 (warmed)"
kind = "temperature"
unit = "°C"
formula = "t1 + f1 * 0.35"                   # 冷水经板换被二次侧加热升温
[sim.sensors.inputs]
t1 = "cdu.pri.t1"
f1 = "cdu.pri.f1"

[[sim.sensors]]
sensor_id = "cdu.pri.t4"
name = "Primary Outlet T4"
kind = "temperature"
unit = "°C"
formula = "t3 + 0.2"
[sim.sensors.inputs]
t3 = "cdu.pri.t3"

[[sim.sensors]]
sensor_id = "cdu.pri.l1"
name = "Primary Level L1"
kind = "level"
unit = "%"
formula = "85"                                # 一次侧缓冲罐液位固定

# ---- 二次侧（热水回路）物理传感器 ----
[[sim.sensors]]
sensor_id = "cdu.sec.f2"
name = "Secondary Flow F2"
kind = "flow"
unit = "L/min"
formula = "10 + (pump1_duty + pump2_duty) * 1.1"   # 两泵并联，总流量∝Σduty

[[sim.sensors]]
sensor_id = "cdu.sec.p5"
name = "From Server P5"
kind = "pressure"
unit = "kPa"
formula = "180 + pump1_duty * 1.0 + pump2_duty * 0.9"  # 服务器回水压力随泵出力

[[sim.sensors]]
sensor_id = "cdu.sec.p6"
name = "From Server P6"
kind = "pressure"
unit = "kPa"
formula = "p5 - 10"
[sim.sensors.inputs]
p5 = "cdu.sec.p5"

[[sim.sensors]]
sensor_id = "cdu.sec.t5"
name = "From Server T5 (hot return)"
kind = "temperature"
unit = "°C"
formula = "42 + 6 * (1 - fan_duty / 100)"    # 风扇越强，回水温度越低

[[sim.sensors]]
sensor_id = "cdu.sec.t6"
name = "From Server T6"
kind = "temperature"
unit = "°C"
formula = "t5 + 0.4"
[sim.sensors.inputs]
t5 = "cdu.sec.t5"

[[sim.sensors]]
sensor_id = "cdu.sec.p7"
name = "To Server P7"
kind = "pressure"
unit = "kPa"
formula = "220 + (pump1_duty + pump2_duty) * 1.3"    # 泵出口侧压力更高

[[sim.sensors]]
sensor_id = "cdu.sec.p8"
name = "To Server P8"
kind = "pressure"
unit = "kPa"
formula = "p7 - 12"
[sim.sensors.inputs]
p7 = "cdu.sec.p7"

[[sim.sensors]]
sensor_id = "cdu.sec.t7"
name = "To Server T7 (cooled supply)"
kind = "temperature"
unit = "°C"
formula = "t5 - f1 * 0.18"                    # ★ 一次侧冷水流量↑ → 二次侧供水降温
[sim.sensors.inputs]
t5 = "cdu.sec.t5"
f1 = "cdu.pri.f1"

[[sim.sensors]]
sensor_id = "cdu.sec.t8"
name = "To Server T8"
kind = "temperature"
unit = "°C"
formula = "t7 + 0.3"
[sim.sensors.inputs]
t7 = "cdu.sec.t7"

# ---- 泵与水箱 ----
[[sim.sensors]]
sensor_id = "cdu.pump1.in_p"
name = "Pump1 Inlet Pressure"
kind = "pressure"
unit = "kPa"
formula = "190 + pump1_duty * 0.5"

[[sim.sensors]]
sensor_id = "cdu.pump1.out_p"
name = "Pump1 Outlet Pressure"
kind = "pressure"
unit = "kPa"
formula = "p_in + pump1_duty^2 * 0.08"        # 离心泵扬程 ∝ duty²
[sim.sensors.inputs]
p_in = "cdu.pump1.in_p"

[[sim.sensors]]
sensor_id = "cdu.pump2.in_p"
name = "Pump2 Inlet Pressure"
kind = "pressure"
unit = "kPa"
formula = "185 + pump2_duty * 0.5"

[[sim.sensors]]
sensor_id = "cdu.pump2.out_p"
name = "Pump2 Outlet Pressure"
kind = "pressure"
unit = "kPa"
formula = "p_in + pump2_duty^2 * 0.08"
[sim.sensors.inputs]
p_in = "cdu.pump2.in_p"

[[sim.sensors]]
sensor_id = "cdu.tank.p9"
name = "Tank P9"
kind = "pressure"
unit = "kPa"
formula = "175 + pump1_duty * 0.3"

[[sim.sensors]]
sensor_id = "cdu.tank.p10"
name = "Tank P10"
kind = "pressure"
unit = "kPa"
formula = "p9 - 3"
[sim.sensors.inputs]
p9 = "cdu.tank.p9"

[[sim.sensors]]
sensor_id = "cdu.tank.level"
name = "Tank Level LL1"
kind = "level"
unit = "%"
formula = "78"                                # 膨胀水箱液位

[[sim.sensors]]
sensor_id = "cdu.tank.ph"
name = "Tank PH1"
kind = "ph"
unit = "pH"
formula = "8.2"                               # 冷却液 pH

# ---- 环境与泄漏 ----
[[sim.sensors]]
sensor_id = "cdu.env.temp"
name = "Ambient Temp"
kind = "temperature"
unit = "°C"
formula = "25"

[[sim.sensors]]
sensor_id = "cdu.env.rh"
name = "Ambient RH"
kind = "humidity"
unit = "%"
formula = "45"

[[sim.sensors]]
sensor_id = "cdu.leak"
name = "Leak Sensor"
kind = "leak"
unit = "leak"
formula = "0"                                 # 0 = 无泄漏
