[workspace]
resolver = "2"
members = ["crates/telemux", "crates/telemux-sim"]

# 单一 Cargo.lock 保证全仓依赖版本一致（如 tokio-modbus/meval）。

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feijihe/telemux-rs"

[workspace.dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "signal", "time", "net", "io-util", "sync"] }
tokio-modbus = { version = "0.17", features = ["rtu", "server", "tcp-server"] }
tokio-serial = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log", "registry"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws", "tokio"] }
futures-util = "0.3.34"
meval = "0.2.0"
# 前端静态资源编译期嵌入（web/dist，由 pnpm build 生成）
include_dir = { version = "0.7", features = ["glob"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
