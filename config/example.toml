# Telmux-rs 示例配置
# 对应 `cargo run --example mock_pcba` 启动的模拟 PCBA 从站寄存器映射。

[general]
log_level = "info"

[[devices]]
name = "pcba-01"
transport = "tcp"
host = "127.0.0.1"
port = 1502
unit_id = 1
poll_interval_ms = 1000
timeout_ms = 500
reconnect_initial_ms = 1000
reconnect_max_ms = 15000

[[devices.registers]]
name = "cpu_temp_raw"
sensor_id = "pcba-01.cpu_temp"
function = "holding"
address = 0
value_type = "u16"
unit = "counts"

[[devices.registers]]
name = "fan_speed_raw"
sensor_id = "pcba-01.fan_speed"
function = "holding"
address = 1
value_type = "u16"
unit = "counts"

[[devices.registers]]
name = "uptime_ticks"
sensor_id = "pcba-01.uptime_ticks"
function = "holding"
address = 2
count = 2
value_type = "u32"
word_order = "big"
unit = "ticks"

[[devices.registers]]
name = "vcore_raw"
sensor_id = "pcba-01.vcore"
function = "holding"
address = 4
count = 2
value_type = "f32"
word_order = "big"
unit = "V"

[[devices.registers]]
name = "vin_raw"
sensor_id = "pcba-01.vin"
function = "input"
address = 0
value_type = "u16"
unit = "mV"

[[devices.registers]]
name = "iin_raw"
sensor_id = "pcba-01.iin"
function = "input"
address = 1
value_type = "u16"
unit = "mA"

# RTU 设备示例（真实串口，基于 tokio-serial）：
