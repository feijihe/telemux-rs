# ===== 处理管道（阶段 3）：原始值 -> 换算 -> 滤波 -> 阈值 =====
# 每个 pipeline 通过 sensor_id 绑定一个寄存器；stage 按顺序执行。

# CPU 温度：原始 counts（0.1°C/count）-> 滑动平均 -> 阈值判断
[[pipeline]]
sensor_id = "pcba-01.cpu_temp"

[[pipeline.stages]]
type = "scale"
scale = 0.1
offset = 0
unit = "°C"

[[pipeline.stages]]
type = "sliding_average"
window = 5

[[pipeline.stages]]
type = "threshold"
low_warning = 10
high_warning = 30
low_critical = 5
high_critical = 35

# 风扇转速：直接展示，单位 RPM
[[pipeline]]
sensor_id = "pcba-01.fan_speed"

[[pipeline.stages]]
type = "scale"
scale = 1.0
unit = "RPM"

# vcore：原始已是浮点电压
[[pipeline]]
sensor_id = "pcba-01.vcore"

[[pipeline.stages]]
type = "scale"
scale = 1.0
unit = "V"

# 输入电压：mV -> V
[[pipeline]]
sensor_id = "pcba-01.vin"

[[pipeline.stages]]
type = "scale"
scale = 0.001
unit = "V"

# 输入电流：mA -> A，并做统计聚合（窗口 4 的均值）
[[pipeline]]
sensor_id = "pcba-01.iin"

[[pipeline.stages]]
type = "scale"
scale = 0.001
unit = "A"

[[pipeline.stages]]
type = "aggregate"
window = 4
mode = "avg"

# 数学表达式示例（注释掉，避免与滑动平均冲突）：
