<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemux Dev Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e0e3e8; --text: #24292f;
    --muted: #6b7280; --ok: #2e7d32; --warn: #b26a00; --crit: #c62828; --stale: #9aa0a6;
    --accent: #1a73e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; }
  h1 span { font-weight: 400; color: var(--muted); font-size: 14px; }
  #status { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; color: var(--muted); }
  #status.ok { background: #e8f5e9; color: var(--ok); }
  #status.err { background: #fdecea; color: var(--crit); }
  #updated { font-size: 12px; color: var(--muted); margin-left: auto; }
  .btn { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 6px 14px;
         border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #f0f1f3; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1667d1; }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  .device { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .device h2 { font-size: 16px; padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 10px; }
  .badge.ok { background: #e8f5e9; color: var(--ok); }
  .badge.down { background: #fdecea; color: var(--crit); }
  .dev-info { font-size: 12px; color: var(--muted); padding: 6px 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: left; border-top: 1px solid var(--border); white-space: nowrap; }
  th { background: #fafbfc; color: var(--muted); font-weight: 600; }
  tbody tr.reg-row { cursor: pointer; }
  tbody tr.reg-row:hover { background: #f0f6ff; }
  tbody tr.detail-row > td { background: #fafbfc; border-top: 1px dashed var(--border); }
  td.num { font-variant-numeric: tabular-nums; }
  .raw { font-weight: 600; }
  .raw.stale { color: var(--stale); }
  .metric { font-weight: 600; }
  .m-normal { color: var(--ok); }
  .m-warning { color: var(--warn); }
  .m-critical { color: var(--crit); }
  .m-unknown { color: var(--stale); }
  .none { color: var(--stale); }
  .empty { padding: 24px; color: var(--muted); text-align: center; }
  .detail { padding: 10px 14px; font-size: 12.5px; color: var(--text); }
  .detail .formula { font-size: 13px; margin-bottom: 8px; }
  .detail .formula b { color: var(--accent); }
  .detail ul { list-style: none; }
  .detail li { padding: 2px 0; }
  .detail .stage-idx { color: var(--muted); margin-right: 6px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
                align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; }
  .modal-mask.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: 640px; max-width: 100%; max-height: 85vh;
           overflow-y: auto; padding: 20px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .modal h3 { margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  input, select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
                  font-size: 13px; background: #fff; color: var(--text); }
  .field { margin-bottom: 2px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .stage-block { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .stage-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .stage-head .type-select { width: 200px; }
  .stage-params { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .err-box { background: #fdecea; color: var(--crit); border: 1px solid #f5c6c0; border-radius: 6px;
             padding: 8px 12px; font-size: 12.5px; margin-top: 10px; display: none; white-space: pre-wrap; }
  .ok-box { background: #e8f5e9; color: var(--ok); border: 1px solid #b7dfb9; border-radius: 6px;
            padding: 8px 12px; font-size: 12.5px; margin-top: 10px; display: none; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Telemux <span>Dev Dashboard</span></h1>
  <span id="status">connecting…</span>
  <span id="updated"></span>
  <button class="btn primary" onclick="openForm()">＋ 新增寄存器</button>
</header>
<main id="content"><div class="empty">正在加载…</div></main>

<!-- 新增寄存器模态 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <h3>新增寄存器</h3>
    <div class="form-grid">
      <div class="field">
        <label>设备</label>
        <select id="f-device"></select>
      </div>
      <div class="field">
        <label>寄存器名称</label>
        <input id="f-name" placeholder="如 volt_raw">
      </div>
      <div class="field">
        <label>sensor_id（全局唯一）</label>
        <input id="f-sensor" placeholder="如 pcba-01.volt">
      </div>
      <div class="field">
        <label>功能码</label>
        <select id="f-function">
          <option value="holding">holding</option>
          <option value="input">input</option>
        </select>
      </div>
      <div class="field">
        <label>起始地址</label>
        <input id="f-address" type="number" min="0" max="65535" value="0">
      </div>
      <div class="field">
        <label>数值类型</label>
        <select id="f-value-type">
          <option value="u16">u16</option>
          <option value="i16">i16</option>
          <option value="u32">u32</option>
          <option value="i32">i32</option>
          <option value="f32">f32</option>
        </select>
      </div>
      <div class="field">
        <label>字序（多寄存器）</label>
        <select id="f-word-order">
          <option value="big">big</option>
          <option value="little">little</option>
        </select>
      </div>
      <div class="field">
        <label>单位（可选）</label>
        <input id="f-unit" placeholder="如 mV">
      </div>
      <div class="field full">
        <label><input type="checkbox" id="f-pipeline-toggle" onchange="togglePipeline()"> 配置处理管道（原始值 → 计算值）</label>
      </div>
    </div>

    <div id="pipeline-area" style="display:none; margin-top: 12px;">
      <div id="stages"></div>
      <button class="btn small" onclick="addStage()">＋ 添加 stage</button>
    </div>

    <div class="err-box" id="form-err"></div>
    <div class="ok-box" id="form-ok"></div>

    <div class="form-actions">
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn primary" onclick="submitForm()">提交</button>
    </div>
  </div>
</div>

<script>
"use strict";

const WS_URL = `ws://${location.host}/api/ws`;
const SNAPSHOT_URL = "/api/snapshot";

let ws = null;
let retryDelay = 500;
let lastSnap = null;              // 最近一次完整快照（表单设备下拉、展开详情用）
let sensorMap = new Map();        // sensor_id -> { rawCell, metricCell, statusCell, timeCell }

const statusEl = document.getElementById("status");
const updatedEl = document.getElementById("updated");

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

/* ---------- 数据获取：HTTP 全量 + WS 增量 ---------- */

async function loadFullSnapshot() {
  try {
    const res = await fetch(SNAPSHOT_URL);
    const snap = await res.json();
    renderFull(snap);
  } catch (e) {
    console.error("load snapshot failed", e);
  }
}

function connect() {
  try { ws = new WebSocket(WS_URL); } catch (e) { scheduleReconnect(); return; }
  ws.onopen = () => { setStatus("● 已连接", "ok"); retryDelay = 500; };
  ws.onmessage = (e) => {
    try { applyUpdate(JSON.parse(e.data)); } catch (err) { console.error("bad update", err); }
  };
  ws.onclose = () => { setStatus("○ 已断开，重连中…", "err"); scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}

// 主动断开：清除 onclose 防止自动重连；之后由调用方决定 reconnect()。
function stopWs() {
  if (ws) { ws.onclose = null; ws.onerror = null; try { ws.close(); } catch (_) {} ws = null; }
}

function scheduleReconnect() {
  setTimeout(connect, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 5000);
}

/* ---------- 渲染 ---------- */

function el(tag, cls) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  return n;
}

function fmt(v) {
  if (v === null || v === undefined) return "—";
  const n = parseFloat(v);
  if (Number.isNaN(n)) return String(v);
  return Number.isInteger(n) ? String(n) : String(parseFloat(n.toPrecision(6)));
}

function fmtTime(ms) {
  if (!ms) return "—";
  return new Date(ms).toLocaleTimeString("zh-CN", { hour12: false });
}

function statusClass(s) { return "m-" + (s || "unknown"); }

const COLUMNS = ["寄存器", "sensor_id", "功能", "地址", "类型", "字序", "单位", "原始值", "计算值", "状态", "更新时间"];

// 完整渲染（首次加载 / 新增寄存器成功后）
function renderFull(snap) {
  lastSnap = snap;
  sensorMap.clear();
  const main = document.getElementById("content");
  main.innerHTML = "";
  updatedEl.textContent = snap.generated_at_ms ? "更新于 " + fmtTime(snap.generated_at_ms) : "";

  if (!snap.devices || snap.devices.length === 0) {
    main.appendChild(Object.assign(el("div", "empty"), { textContent: "未配置设备" }));
    return;
  }

  for (const dev of snap.devices) {
    const section = el("section", "device");
    const h = el("h2");
    h.textContent = dev.name;
    const badge = el("span", dev.connected ? "badge ok" : "badge down");
    badge.textContent = dev.connected ? "● online" : "○ offline";
    h.appendChild(badge);
    section.appendChild(h);

    const info = el("div", "dev-info");
    info.textContent = `${dev.transport}  ${dev.host}:${dev.port}   ·   ${dev.registers.length} 个寄存器`;
    section.appendChild(info);

    const table = el("table");
    const thead = el("thead");
    const trh = el("tr");
    for (const c of COLUMNS) trh.appendChild(Object.assign(el("th"), { textContent: c }));
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = el("tbody");
    dev.registers.forEach((reg) => {
      const tr = el("tr");
      tr.classList.add("reg-row");
      tr.dataset.sensorId = reg.sensor_id;
      tr.title = "点击查看计算链路";
      tr.onclick = () => toggleDetail(tbody, tr, reg);

      const cells = [
        el("td"), el("td"), el("td"), el("td"), el("td"), el("td"), el("td"),
        el("td", "num raw"), el("td", "num metric"), el("td"), el("td"),
      ];
      cells[0].textContent = reg.name;
      cells[1].textContent = reg.sensor_id;
      cells[2].textContent = reg.function;
      cells[3].textContent = reg.address;
      cells[4].textContent = reg.value_type + (reg.count > 1 ? "×" + reg.count : "");
      cells[5].textContent = reg.word_order;
      cells[6].textContent = reg.unit || "—";

      // 数据单元格初始值（若快照里有）
      if (reg.raw) {
        cells[7].textContent = fmt(reg.raw.value);
      } else {
        cells[7].classList.add("none");
        cells[7].textContent = "—";
      }
      if (reg.metric) {
        cells[8].textContent = fmt(reg.metric.value) + (reg.metric.unit ? " " + reg.metric.unit : "");
        cells[8].classList.add(statusClass(reg.metric.status));
        cells[9].textContent = reg.metric.status;
        cells[9].className = statusClass(reg.metric.status);
      } else {
        cells[8].classList.add("none");
        cells[8].textContent = "—";
        cells[9].textContent = "—";
        cells[9].className = "none";
      }
      cells[10].textContent = reg.raw ? fmtTime(reg.raw.timestamp_ms) : "—";

      for (const c of cells) tr.appendChild(c);
      tbody.appendChild(tr);

      sensorMap.set(reg.sensor_id, {
        rawCell: cells[7], metricCell: cells[8], statusCell: cells[9], timeCell: cells[10],
      });
    });
    table.appendChild(tbody);
    section.appendChild(table);
    main.appendChild(section);
  }
}

// 增量更新：只改数据单元格，不重建 DOM（展开行、滚动位置保持不变）
function applyUpdate(msg) {
  if (!msg || msg.type !== "update" || !Array.isArray(msg.samples)) return;
  for (const s of msg.samples) {
    const e = sensorMap.get(s.sensor_id);
    if (!e) continue; // 配置表里还没有（新寄存器首次 poll 前）——保持占位

    if (s.raw) {
      e.rawCell.textContent = fmt(s.raw.value);
      e.rawCell.classList.remove("stale");
      e.rawCell.classList.remove("none");
      e.timeCell.textContent = fmtTime(s.raw.timestamp_ms);
      if (Date.now() - s.raw.timestamp_ms > 5000) e.rawCell.classList.add("stale");
    } else {
      e.rawCell.classList.add("none");
      e.rawCell.textContent = "—";
      e.timeCell.textContent = "—";
    }

    if (s.metric) {
      e.metricCell.textContent = fmt(s.metric.value) + (s.metric.unit ? " " + s.metric.unit : "");
      e.metricCell.classList.remove("none");
      e.metricCell.classList.add(statusClass(s.metric.status));
      e.statusCell.textContent = s.metric.status;
      e.statusCell.className = statusClass(s.metric.status);
    } else {
      e.metricCell.classList.add("none");
      e.metricCell.textContent = "—";
      e.statusCell.textContent = "—";
      e.statusCell.className = "none";
    }
  }
  if (msg.generated_at_ms) updatedEl.textContent = "更新于 " + fmtTime(msg.generated_at_ms);
}

/* ---------- 行点击展开详情 ---------- */
function toggleDetail(tbody, tr, reg) {
  const detail = tr.nextElementSibling;
  if (detail && detail.classList.contains("detail-row")) {
    detail.remove();
    return;
  }
  for (const row of tbody.querySelectorAll("tr.detail-row")) row.remove();

  const dtr = el("tr");
  dtr.classList.add("detail-row");
  const td = el("td");
  td.colSpan = COLUMNS.length;
  const box = el("div", "detail");

  if (reg.stages && reg.stages.length > 0) {
    const formula = el("div", "formula");
    formula.innerHTML = "计算链路：<b>" + escapeHtml(reg.formula || reg.stages.join(" → ")) + "</b>";
    box.appendChild(formula);
    const ul = el("ul");
    reg.stages.forEach((s, i) => {
      const li = el("li");
      const idx = el("span", "stage-idx");
      idx.textContent = `#${i + 1}`;
      li.appendChild(idx);
      li.appendChild(document.createTextNode(s));
      ul.appendChild(li);
    });
    box.appendChild(ul);
  } else {
    box.appendChild(Object.assign(el("div", "muted"), { textContent: "该寄存器未配置处理管道（无计算值）。" }));
  }
  td.appendChild(box);
  dtr.appendChild(td);
  tr.after(dtr);
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- 新增寄存器表单 ---------- */
function openForm() {
  document.getElementById("form-err").style.display = "none";
  document.getElementById("form-ok").style.display = "none";
  const devSel = document.getElementById("f-device");
  devSel.innerHTML = "";
  if (lastSnap && lastSnap.devices) {
    for (const d of lastSnap.devices) {
      devSel.appendChild(Object.assign(new Option(d.name, d.name)));
    }
  }
  document.getElementById("modal").classList.add("open");
}

function closeForm() {
  document.getElementById("modal").classList.remove("open");
}

function togglePipeline() {
  const on = document.getElementById("f-pipeline-toggle").checked;
  document.getElementById("pipeline-area").style.display = on ? "block" : "none";
  if (on && !document.querySelector("#stages .stage-block")) addStage();
}

function stageParamFields(type) {
  switch (type) {
    case "scale":
      return `{name:"scale",type:"number",step:"any",label:"scale",def:"1"},
              {name:"offset",type:"number",step:"any",label:"offset",def:"0"},
              {name:"unit",type:"text",label:"单位(可选)",def:""}`;
    case "sliding_average":
    case "median":
      return `{name:"window",type:"number",min:"1",label:"window",def:"5"}`;
    case "math":
      return `{name:"expression",type:"text",label:"表达式(变量 v)",def:"v * 1"}`;
    case "threshold":
      return `{name:"low_critical",type:"number",step:"any",label:"低临界",def:""},
              {name:"low_warning",type:"number",step:"any",label:"低警告",def:""},
              {name:"high_warning",type:"number",step:"any",label:"高警告",def:""},
              {name:"high_critical",type:"number",step:"any",label:"高临界",def:""}`;
    case "aggregate":
      return `{name:"window",type:"number",min:"1",label:"window",def:"4"},
              {name:"mode",type:"select",options:["min","max","avg"],label:"mode",def:"avg"}`;
    default:
      return "";
  }
}

function addStage() {
  const wrap = document.getElementById("stages");
  const block = el("div", "stage-block");

  const head = el("div", "stage-head");
  const sel = el("select");
  sel.className = "type-select";
  for (const t of ["scale", "sliding_average", "median", "math", "threshold", "aggregate"]) {
    sel.appendChild(new Option(t, t));
  }
  const del = el("button", "btn small");
  del.textContent = "删除";
  del.onclick = () => block.remove();
  head.appendChild(sel);
  head.appendChild(del);
  block.appendChild(head);

  const params = el("div", "stage-params");
  block.appendChild(params);
  wrap.appendChild(block);

  const buildParams = () => {
    params.innerHTML = "";
    try {
      const fields = eval("[" + stageParamFields(sel.value) + "]");
      for (const f of fields) {
        const field = el("div", "field");
        const lbl = el("label");
        lbl.textContent = f.label;
        field.appendChild(lbl);
        let input;
        if (f.type === "select") {
          input = el("select");
          for (const o of f.options) input.appendChild(new Option(o, o));
          if (f.def) input.value = f.def;
        } else {
          input = el("input");
          input.type = f.type;
          if (f.min) input.min = f.min;
          if (f.step) input.step = f.step;
          if (f.def) input.value = f.def;
        }
        input.dataset.param = f.name;
        field.appendChild(input);
        params.appendChild(field);
      }
    } catch (e) { /* ignore */ }
  };
  sel.onchange = buildParams;
  buildParams();
}

function collectStages() {
  const stages = [];
  for (const block of document.querySelectorAll("#stages .stage-block")) {
    const type = block.querySelector(".type-select").value;
    const stage = { type };
    for (const input of block.querySelectorAll("[data-param]")) {
      const v = input.value.trim();
      if (v === "") continue;
      if (input.type === "number") {
        const n = parseFloat(v);
        if (!Number.isNaN(n)) stage[input.dataset.param] = n;
      } else {
        stage[input.dataset.param] = v;
      }
    }
    stages.push(stage);
  }
  return stages;
}

async function submitForm() {
  const errBox = document.getElementById("form-err");
  const okBox = document.getElementById("form-ok");
  errBox.style.display = "none";
  okBox.style.display = "none";

  const name = document.getElementById("f-name").value.trim();
  const sensor = document.getElementById("f-sensor").value.trim();
  const address = parseInt(document.getElementById("f-address").value, 10);
  const device = document.getElementById("f-device").value;

  if (!name || !sensor) { showErr(errBox, "寄存器名称和 sensor_id 必填"); return; }
  if (!Number.isInteger(address) || address < 0 || address > 65535) {
    showErr(errBox, "地址必须是 0-65535 的整数"); return;
  }

  const payload = {
    device,
    register: {
      name,
      sensor_id: sensor,
      function: document.getElementById("f-function").value,
      address,
      value_type: document.getElementById("f-value-type").value,
      word_order: document.getElementById("f-word-order").value,
      unit: document.getElementById("f-unit").value.trim() || null,
    },
    pipeline: null,
  };

  if (document.getElementById("f-pipeline-toggle").checked) {
    const stages = collectStages();
    if (stages.length === 0) { showErr(errBox, "已勾选处理管道，请至少添加一个 stage"); return; }
    payload.pipeline = { sensor_id: sensor, stages };
  }

  // 提交期间暂停 WS 更新，避免表格在重取全量时闪变
  stopWs();

  try {
    const res = await fetch("/api/registers", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      okBox.textContent = "✓ 提交成功，正在刷新寄存器表…";
      okBox.style.display = "block";
      // 成功：HTTP 重新拉取完整表（含新寄存器），再恢复 WS 增量
      await loadFullSnapshot();
      connect();
      setTimeout(() => { closeForm(); }, 1200);
    } else {
      showErr(errBox, "校验失败：\n" + (data.error || "未知错误"));
      // 失败：不刷新表，恢复 WS 继续更新
      connect();
    }
  } catch (e) {
    showErr(errBox, "请求失败：" + e.message);
    connect();
  }
}

function showErr(box, msg) {
  box.textContent = msg;
